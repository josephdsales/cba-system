# Render Blueprint: 1 Docker web service.
# The database is external and FREE: Neon Postgres (never expires).
# Set DATABASE_URL in the Render dashboard to the Neon connection string.
# sync: false => blueprint syncs never overwrite the dashboard value.
# (The old free Render Postgres "cba-db" expired after 30 days, so it is no
# longer declared here. Syncing never deletes resources — delete cba-db
# manually in the dashboard after the migration.)
services:
  - type: web
    name: cba-system
    runtime: docker
    plan: free
    healthCheckPath: /index.php
    envVars:
      - key: DATABASE_URL
        sync: false
